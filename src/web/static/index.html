<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <script>
    (function() {
        var saved = localStorage.getItem('vta_theme_preference');
        var theme = saved || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频转录 - VideoTranscriptAPI</title>
    <meta name="description" content="提交视频转录任务，支持 YouTube、Bilibili、抖音、小红书、微信视频号、小宇宙等多平台">
    <meta name="theme-color" content="#4f46e5">
    <meta name="robots" content="noindex">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button id="theme-toggle" class="theme-toggle" title="切换到浅色模式">
                ☀️
            </button>
            <nav class="site-nav">
                <a href="/" class="site-nav-link">🏠 主页</a>
                <a href="/static/history.html" class="site-nav-link">📋 任务历史</a>
                <button type="button" id="pwa-install-btn" class="site-nav-link"
                        style="display:none; min-height:44px; background:none; cursor:pointer; font:inherit;"
                        aria-label="安装应用到桌面">📥 安装应用</button>
            </nav>
            <h1>🎬 视频转录服务</h1>
            <p>粘贴链接，快速开始转录</p>
        </header>

        <main class="main-content">
            <form id="transcribe-form" class="form-container">
                <!-- URL输入区域 -->
                <div class="form-group share-input-group">
                    <label for="share-content" class="form-label">
                        📋 粘贴分享内容或视频链接
                    </label>
                    <textarea
                        id="share-content"
                        class="form-textarea"
                        placeholder="粘贴链接或完整分享文案"
                        rows="3"
                        autocapitalize="sentences"
                        spellcheck="true"
                        aria-describedby="input-feedback">
                    </textarea>
                    <p id="input-feedback" class="input-feedback" role="status"
                       aria-live="polite" hidden></p>

                    <!-- URL识别结果：仅在找到链接时显示 -->
                    <div id="url-preview" class="url-preview" aria-live="polite" hidden></div>
                </div>

                <!-- 高频选项入口：摘要常驻，说明按需展开 -->
                <div class="form-group transcription-options-group">
                    <button type="button" id="transcription-options-toggle"
                            class="transcription-options-toggle"
                            aria-expanded="false" aria-controls="transcription-options">
                        <span class="toggle-left">🎤 转录选项</span>
                        <span id="transcription-options-summary" class="transcription-options-summary">未启用说话人识别</span>
                        <span class="toggle-icon">▼</span>
                    </button>
                    <div id="transcription-options" class="transcription-options-panel" hidden>
                        <div class="checkbox-group">
                            <input type="checkbox" id="speaker-recognition" class="form-checkbox">
                            <label for="speaker-recognition" class="checkbox-label">
                                启用说话人识别
                                <span class="checkbox-desc">适用于多人对话、访谈等场景</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 无令牌时的明确阻塞提示 -->
                <div id="auth-missing-prompt" class="auth-missing-prompt" role="status"
                     hidden
                     aria-live="polite">
                    <span>尚未配置访问令牌</span>
                    <button type="button" id="auth-settings-link" class="auth-settings-link"
                            aria-controls="advanced-settings">去设置</button>
                </div>

                <!-- 主操作 -->
                <div class="form-group submit-group">
                    <button type="submit" id="submit-btn" class="submit-btn" disabled>
                        <span class="btn-icon">🚀</span>
                        <span class="btn-text">开始转录</span>
                    </button>
                </div>

                <!-- 低频设置：Webhook 和访问令牌按需展开 -->
                <div class="form-group advanced-group">
                    <button type="button" id="advanced-toggle" class="advanced-toggle"
                            aria-expanded="false" aria-controls="advanced-settings">
                        <span class="toggle-left">⚙️ 更多设置</span>
                        <span class="advanced-summary">访问令牌 · Webhook</span>
                        <span class="toggle-icon">▼</span>
                    </button>

                    <div id="advanced-settings" class="advanced-settings" hidden>
                        <!-- 访问令牌 -->
                        <div class="form-group">
                            <label for="bearer-token" class="form-label required">
                                🔐 访问令牌 <span class="required-mark">*</span>
                            </label>
                            <div class="input-group">
                                <input
                                    type="password"
                                    id="bearer-token"
                                    class="form-input"
                                    placeholder="请输入访问令牌"
                                    required
                                >
                                <button type="button" id="toggle-token-visibility" class="input-btn">👁️</button>
                            </div>
                            <small class="form-help">
                                <span class="required-text">必填项</span> - 令牌将安全地保存在浏览器本地
                            </small>
                        </div>

                        <!-- 企业微信 Webhook -->
                        <div class="form-group">
                            <label for="wechat-webhook" class="form-label">
                                📢 企业微信 Webhook 地址
                            </label>
                            <div class="input-group">
                                <input
                                    type="text"
                                    id="wechat-webhook"
                                    class="form-input"
                                    placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..."
                                >
                                <button type="button" id="clear-webhook" class="input-btn">🗑️</button>
                            </div>
                            <small class="form-help">
                                可选项 - 用于接收任务完成通知，留空则使用系统默认配置。输入后自动保存到浏览器本地
                            </small>
                        </div>

                        <!-- 任务完成通知（PWA E5，仅浏览器支持 Notification 时由 pwa.js 显示） -->
                        <div class="form-group" id="pwa-notify-group" style="display:none">
                            <label class="form-label">
                                🔔 任务完成通知
                            </label>
                            <button type="button" id="pwa-notify-btn" class="advanced-toggle"
                                    style="min-height:44px" aria-label="开启任务完成通知">
                                开启通知
                            </button>
                            <small class="form-help">
                                可选项 - 页面打开期间，任务完成时弹出系统通知，点击直达结果页
                            </small>
                        </div>

                    </div>
                </div>
            </form>

            <!-- 状态显示区域 -->
            <div id="status-container" class="status-container" style="display: none;" aria-live="polite">
                <div id="status-content" class="status-content">
                    <!-- 动态内容 -->
                </div>
            </div>

            <!-- 历史记录区域 -->
            <div id="history-container" class="history-container" style="display: none;">
                <h3>📋 最近任务</h3>
                <div id="history-list" class="history-list">
                    <!-- 动态内容 -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Powered by <a href="https://github.com/zj1123581321/VideoTranscriptAPI" target="_blank" rel="noopener">VideoTranscriptAPI</a> · Open Source · <a href="https://github.com/zj1123581321/VideoTranscriptAPI" target="_blank" rel="noopener">☆ Star on GitHub</a></p>
        </footer>
    </div>

    <script src="/static/js/auth-storage.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/pwa-share.js"></script>
    <script src="/static/pwa.js" defer></script>
</body>
</html>
