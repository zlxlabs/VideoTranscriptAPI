name: Browser regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-regression:
    runs-on: [self-hosted, ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify runner-provided toolchain
        run: which uv && uv --version && uv cache dir && npm config get cache
      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root Node dependencies
        run: npm ci
      - name: Install browser-test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install canonical Chromium browser
        working-directory: e2e
        run: npx playwright install chromium

      - name: Run existing Vitest web contracts
        run: npm run test:web
      - name: Run blocking Chromium regression
        run: npm run test:browser

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/node_modules/.cache/playwright-test-results/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
