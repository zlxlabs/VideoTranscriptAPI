# @generated by docker-package skill
# @skill-version 4
services:
  video-transcript-api:
    image: ${VIDEO_TRANSCRIPT_IMAGE:-video-transcript-api:dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: video-transcript-api
    environment:
      - TZ=Asia/Shanghai
    # 部署环境值只经 env_file 注入 os.environ，不随 config/data 卷恢复。
    # VTA_UPLOADS_ENABLED 缺失、空值或非精确小写 true 时保持关闭；不得为诊断而开启。
    # 可观测 DSN 也只经 env_file 注入；缺 ops.env 仍可启动，DSN 绝不写入 config.jsonc。
    env_file:
      - path: ops.env
        required: false
    ports:
      # 宿主端口 8200（n305 上 portainer 已占 8000）；外部入口
      # https://sum.lexgogo.site 经 Cloudflare Tunnel 落到 :8200。
      - "8200:8000"
    # 必须大于内部关闭预算 20s，否则 SIGKILL 可能打断优雅关闭流程。
    stop_grace_period: 30s
    volumes:
      # Configuration files (user must prepare before starting)
      - ../config:/app/config
      # Persistent data: cache, logs, transcription results
      - ../data:/app/data
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
