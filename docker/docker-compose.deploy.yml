# @generated by docker-package skill
# @skill-version 4
# Seeded to the server project root as docker-compose.yml.
services:
  video-transcript-api:
    image: ${VIDEO_TRANSCRIPT_IMAGE:?VIDEO_TRANSCRIPT_IMAGE must be an immutable digest}
    container_name: video-transcript-api
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    ports:
      - "8200:8000"
    # 必须大于内部关闭预算 20s，否则 SIGKILL 可能打断优雅关闭流程。
    stop_grace_period: 30s
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
